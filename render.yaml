services:
  - type: web
    name: promptshield-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TARGET_MODEL
        sync: false
      - key: GEMINI_JUDGE_MODEL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: REQUEST_DELAY_SECONDS
        value: "4"
      - key: MAX_TESTS_PER_RUN
        value: "15"
      - key: DAILY_CALL_CAP
        value: "100"
